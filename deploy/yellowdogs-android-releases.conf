# Include inside the existing HTTPS server for yellowdogsleague.online.
# Only APK/metadata release files go here. Never copy outputs/android-private.
location = /android/releases/latest.json {
    alias /var/lib/yellowdogs-android/releases/latest.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
location ^~ /android/releases/ {
    alias /var/lib/yellowdogs-android/releases/;
    autoindex off;
    types { application/vnd.android.package-archive apk; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
}
