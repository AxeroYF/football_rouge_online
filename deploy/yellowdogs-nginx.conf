limit_req_zone $binary_remote_addr zone=yellowdogs_login:1m rate=3r/s;

server {
    listen 80;
    server_name 106.54.12.175;
    client_max_body_size 20m;
    server_tokens off;
    gzip on;
    gzip_comp_level 2;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/geo+json image/svg+xml;

    location ~ ^/api/(campaign/(login|register)|admin/login)$ {
        limit_req zone=yellowdogs_login burst=12 nodelay;
        limit_req_status 429;
        error_page 429 = @login_limited;
        include /etc/nginx/snippets/yellowdogs-proxy.conf;
    }
    location @login_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error":"登录请求过于频繁，请稍后重试"}';
    }
    location / {
        include /etc/nginx/snippets/yellowdogs-proxy.conf;
    }
}
