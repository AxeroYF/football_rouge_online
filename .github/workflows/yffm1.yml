name: YFFM1 core checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/check-source.mjs
      - run: npm run test:quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.node }}
          path: outputs/tests/
  release-tag:
    needs: core
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/yffm1' && startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create immutable YFFM1 version tag
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          tag="yffm1-v${version}"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-parse "$tag^{commit}")" = "$GITHUB_SHA"
            exit
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" "$GITHUB_SHA" -m "YFFM1 ${version}; see CHANGELOG.md"
          git push origin "refs/tags/$tag"
